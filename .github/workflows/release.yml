# Builds the Flatpak from the tagged commit, runs the test suite inside the build sandbox
# and attaches the single-file bundle to the GitHub release of that tag. The job runs in
# the Flathub-maintained container image that carries flatpak-builder, the KDE 6.10
# runtime and SDK and the Flathub remote; the PySide BaseApp is fetched from Flathub at
# build time. Only x86_64 is built: the hosted runners are x86_64 and the bundle is
# architecture-specific.
name: Release

on:
  push:
    # A tag of the form v<version>, pushed after the MetaInfo release entry and
    # `__version__` carry the same version.
    tags:
      - "v*"

# The release step creates the GitHub release and uploads the bundle, which needs write
# access to the repository contents; nothing else is granted.
permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      # flatpak-builder sets up its own sandbox with bubblewrap, which needs the
      # privileges a plain container does not have.
      options: --privileged
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the app and run its test suite in the sandbox
        # The manifest's dir source is the checkout; rofiles-fuse is unavailable in a
        # container; the repo directory receives the built ref for the bundle step. The
        # branch is "stable" for every release, so a newer bundle upgrades an existing
        # installation instead of sitting next to it (the manifest cannot carry the
        # branch itself: Flathub's linter rejects a top-level branch key).
        run: >-
          flatpak-builder
          --install-deps-from=flathub
          --disable-rofiles-fuse
          --force-clean
          --default-branch=stable
          --repo=repo
          build-dir
          flatpak/io.github.MarioStoilov.BtHandsfreeKDE.yml

      - name: Export the single-file bundle
        # The runtime repo reference lets `flatpak install <bundle>` add Flathub and
        # fetch the KDE runtime when the user does not have it yet. The file name
        # carries the version from the tag, without the leading v.
        run: >-
          flatpak build-bundle
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          repo
          "bt-handsfree-kde-${GITHUB_REF_NAME#v}-x86_64.flatpak"
          io.github.MarioStoilov.BtHandsfreeKDE
          stable

      - name: Create the release and attach the bundle
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bt-handsfree-kde-*-x86_64.flatpak
          # The release body is generated from the commits since the previous tag; it
          # can be edited on GitHub afterwards.
          generate_release_notes: true
