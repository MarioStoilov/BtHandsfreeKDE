[project]
name = "bt-handsfree-kde"
version = "0.1.0"
description = "Bluetooth hands-free call controller for the KDE Plasma system tray"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Mario Stoilov" }]
dependencies = [
  "PySide6-Essentials>=6.8",
  "dbus-fast>=2.30",
  "qasync>=0.27",
]

[project.urls]
Homepage = "https://github.com/MarioStoilov/BtHandsfreeKDE"
Issues = "https://github.com/MarioStoilov/BtHandsfreeKDE/issues"

[project.scripts]
bt-handsfree-kde = "bt_handsfree_kde.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt_handsfree_kde"]

[dependency-groups]
dev = [
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast declares D-Bus signatures as string annotations ("i", "as", ...), which ruff
# would otherwise read as undefined forward references.
"src/bt_handsfree_kde/dbusmenu.py" = ["F821", "F722", "UP037"]
"src/bt_handsfree_kde/statusnotifier.py" = ["F821", "F722", "UP037"]
